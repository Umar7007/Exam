<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>INSURE Landing Page</title>
  <link rel="stylesheet" href="stiyle.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container">
      <img src="./INSURE.svg" alt="Insure Logo" class="logo" />
      <nav class="nav">
        <a href="#">HOW WE WORK</a>
        <a href="#">BLOG</a>
        <a href="#">ACCOUNT</a>
        <button class="btn btn-outline">VIEW PLANS</button>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-content">
      <div class="hero-text">
        <h1>Humanizing your insurance.</h1>
        <p>Get your life insurance coverage easier and faster. We blend our expertise and technology to help you find the plan that’s right for you. Ensure you and your loved ones are protected.</p>
        <button class="btn btn-light">VIEW PLANS</button>
      </div>
      <div class="hero-image">
        <img src="./Bitmap.png" alt="Hero Image">
      </div>
    </div>
  </section>

  <section class="different">
    <h1>We’re different</h1>
    <img src="./Group 16.png" alt="Different Icons">
  </section>

  <section class="how-we-work">
    <div class="container">
      <h1>Find out more about how we work</h1>
      <button class="btn btn-outline-light">HOW WE WORK</button>
    </div>
  </section>

  <footer class="footer">
    <img src="./Group 21.png" alt="Footer" />
  </footer>
</body>
</html>
